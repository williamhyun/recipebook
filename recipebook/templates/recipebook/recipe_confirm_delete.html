{% extends "recipebook/base.html" %}
{% block title %}Delete Recipe · RecipeBook{% endblock %}

{% block content %}
<h1 class="h4">Delete Recipe</h1>
<p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'recipe_detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
